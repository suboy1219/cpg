name: Sync news symbols
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-news-symbols.yml'
      - 'scripts/sync_news_symbols.py'
permissions:
  contents: write
concurrency:
  group: sync-news-symbols
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate fresh feed
        run: python3 scripts/sync_news_symbols.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- news-symbols.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-symbols.json
          git commit -m "Update news symbols"
          git push
